{% set version = environ['GROMACS_PLUMED_VERSION'] %}
{% set revision = environ['GROMACS_BUILD_NUMBER'] | int %}
{% set sha = environ['GROMACS_PLUMED_SHA'] %}
package:
  name: plumed
  version: {{ version }}
source:
  path: ../../..
build:
  number: {{ revision }}
  string: gromacs_test_g{{ sha[:12] }}_{{ revision }}
  no_link:
    - bin/plumed
requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
  host:
    - llvm-openmp  # [osx]
    - libgomp  # [linux]
test:
  commands:
    - plumed info --long-version
    - plumed patch --help
    - test -f "$PREFIX/lib/libplumedKernel$SHLIB_EXT"
    - "! plumed config has real_mpi"
about:
  home: https://www.plumed.org/
  license: LGPL-3.0-only
  license_file: COPYING.LESSER
  summary: Internal minimal PLUMED patcher/test kernel; never published
