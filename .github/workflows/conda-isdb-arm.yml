name: Updated ISDB conda macOS ARM validation
on:
  push:
    branches: [agents/conda-packaging/isdb-arm]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: conda-isdb-arm-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -el {0}
env:
  VERSION: 2.11.0dev6
  CPU_COUNT: 4
  PLUMED_NUM_THREADS: 2
  CONDA_BLD_PATH: /tmp/plumed-conda-bld
  CONDA_ALWAYS_COPY: "true"
jobs:
  packages:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install packaging tools
        run: conda install -y conda-build python=3.13
      - name: Check declarations and module selection
        run: |
          python extensions/tests/kernel_requirements.py
          python extensions/tests/configure_selection.py
      - name: Build the updated kernel and all supported package variants
        run: bash conda/run-conda-build.sh
      - name: Validate fresh installations and the updated numerical selection
        run: bash conda/run-conda-test.sh
      - name: Preserve packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conda-macos-15
          path: ${{ env.CONDA_BLD_PATH }}/*/*.conda
          if-no-files-found: error
