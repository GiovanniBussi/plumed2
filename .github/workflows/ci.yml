# Temporary validation commit: do not include this workflow change upstream.
name: CI

on:
  push:
    branches: [agents/fix-recurrent-ci-error/subprocess]
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUMED_STACK_TRACE: yes
  PLUMED_NUM_THREADS: 2
  PLUMED_LONG_TESTS: no
  CC: gcc
  CXX: g++

jobs:
  macsimple:
    name: macsimple (macos-latest)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set paths
      run: |
        echo "$HOME/opt/bin" >> $GITHUB_PATH
        echo "CPATH=$HOME/opt/include:$CPATH" >> $GITHUB_ENV
        echo "INCLUDE=$HOME/opt/include:$INCLUDE" >> $GITHUB_ENV
        echo "LIBRARY_PATH=$HOME/opt/lib:$LIBRARY_PATH" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=$HOME/opt/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
    - name: Build PLUMED
      run: |
        # it seems brew update is screwing up something
        # GB on Mar 8, 2024
        #brew update > /dev/null
        brew install gawk
        ./configure --disable-dependency-tracking --prefix="$HOME/opt"
        make -j 4
        make install
    - name: Check architecture and AsmJit availability
      run: |
        uname -m
        plumed config has asmjit
    - name: Run tests
      run: |
         # regtests run in their own tmp/ directories, so they can run concurrently
         make --no-print-directory -j 2 -C regtest
         # these can fail for numerical reasons
         make -C regtest checkfail
    - name: Repeat subprocess stress and signal regressions
      run: |
        for attempt in {1..20}; do
          echo "Subprocess stress attempt $attempt"
          make --no-print-directory -C regtest/basic rt-make-subprocess rt-make-subprocess-signals
          ! grep -E 'FAILURE|NOT_APPLICABLE' regtest/basic/rt-make-subprocess/report.txt regtest/basic/rt-make-subprocess-signals/report.txt
        done
