name: Conda lifetime diagnostics

on:
  push:
    branches: ["agents/review-1699/diagnose-conda*"]
  workflow_dispatch:
    inputs:
      long_tests:
        description: Retained for publication-wiring validation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  conda:
    uses: ./.github/workflows/condaWF.yml
    with:
      full_matrix: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
