name: Build GROMACS Conda packages

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      platform:
        type: string
        required: true
      cuda_variants:
        type: string
        required: true
      channel_runtime_check:
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  patcher:
    name: Minimal PLUMED (${{ inputs.platform }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: gromacs-source-manifest
          path: conda/gromacs
      - run: python3 conda/gromacs/package.py environment
      - name: Install Conda build tools
        run: |
          curl -fLO https://raw.githubusercontent.com/GiovanniBussi/conda-ci/master/conda-ci
          source ./conda-ci install
          conda create -y -p "$RUNNER_TEMP/gromacs-tools" --override-channels \
            -c conda-forge python=3.12 conda-build conda-index
          if [[ $(uname) == Darwin ]]; then
            echo "CONDA_BUILD_SYSROOT=$(/usr/bin/xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          fi
      - name: Build minimal serial PLUMED from this commit
        run: |
          source activate "$RUNNER_TEMP/gromacs-tools"
          unset CC CXX
          conda build --override-channels -c conda-forge --no-anaconda-upload conda/gromacs/minimal \
            -m conda/gromacs/variants.yaml
      - uses: actions/upload-artifact@v6
        with:
          name: gromacs-patcher-${{ inputs.platform }}
          path: ${{ runner.temp }}/gromacs-conda-bld/${{ inputs.platform }}/plumed-*.conda
          if-no-files-found: error
          retention-days: 14

  build:
    name: GROMACS (${{ inputs.platform }}, ${{ matrix.mpi }}, ${{ matrix.gpu }})
    needs: patcher
    runs-on: ${{ inputs.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mpi: [tmpi, openmpi]
        gpu: ${{ fromJSON(inputs.platform == 'linux-64' && inputs.cuda_variants || '["cpu"]') }}
    env:
      GROMACS_MPI: ${{ matrix.mpi }}
      GROMACS_GPU: ${{ matrix.gpu }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: gromacs-source-manifest
          path: conda/gromacs
      - run: python3 conda/gromacs/package.py environment
      - name: Install Conda build tools
        run: |
          curl -fLO https://raw.githubusercontent.com/GiovanniBussi/conda-ci/master/conda-ci
          source ./conda-ci install
          conda create -y -p "$RUNNER_TEMP/gromacs-tools" --override-channels \
            -c conda-forge python=3.12 conda-build conda-index
          if [[ $(uname) == Darwin ]]; then
            echo "CONDA_BUILD_SYSROOT=$(/usr/bin/xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@v7
        with:
          name: gromacs-patcher-${{ inputs.platform }}
          path: ${{ runner.temp }}/gromacs-conda-bld/${{ inputs.platform }}
      - name: Install temporary patcher and apply runtime patch
        run: |
          source activate "$RUNNER_TEMP/gromacs-tools"
          patchers=("$CONDA_BLD_PATH/${{ inputs.platform }}"/plumed-*.conda)
          test "${#patchers[@]}" -eq 1
          conda index "$CONDA_BLD_PATH"
          spec=$(python conda/gromacs/package.py spec --archive "${patchers[0]}")
          conda create -y -p "$RUNNER_TEMP/patcher" --override-channels \
            -c "file://$CONDA_BLD_PATH" -c conda-forge "$spec" python=3.12
          conda activate "$RUNNER_TEMP/patcher"
          python conda/gromacs/stage.py
      - name: Build GROMACS Conda archive
        run: |
          source activate "$RUNNER_TEMP/gromacs-tools"
          unset CC CXX
          conda index "$CONDA_BLD_PATH"
          variants=(-m conda/gromacs/variants.yaml)
          if [[ $GROMACS_GPU != cpu ]]; then
            python -c 'import json,os; json.dump({"cuda_compiler": ["cuda-nvcc"], "cuda_compiler_version": [os.environ["GROMACS_CUDA_VERSION"]], "cxx_compiler_version": ["14"]}, open(os.environ["RUNNER_TEMP"]+"/cuda-variant.yaml", "w"))'
            variants+=(-m "$RUNNER_TEMP/cuda-variant.yaml")
          fi
          conda build --override-channels -c local -c conda-forge --no-anaconda-upload conda/gromacs/recipe \
            "${variants[@]}"
      - name: Validate installed package with the matching temporary kernel
        run: |
          source activate "$RUNNER_TEMP/gromacs-tools"
          packages=("$CONDA_BLD_PATH/${{ inputs.platform }}"/gromacs-plumed-*.conda)
          patchers=("$CONDA_BLD_PATH/${{ inputs.platform }}"/plumed-*.conda)
          test "${#packages[@]}" -eq 1
          spec=$(python conda/gromacs/package.py spec --archive "${packages[0]}")
          patcher_spec=$(python conda/gromacs/package.py spec --archive "${patchers[0]}")
          conda index "$CONDA_BLD_PATH"
          conda create -y -p "$RUNNER_TEMP/installed" --override-channels \
            -c "file://$CONDA_BLD_PATH" -c conda-forge "$spec" "$patcher_spec" python=3.12 numpy
          conda activate "$RUNNER_TEMP/installed"
          bash conda/gromacs/test-installed.sh
      - name: Validate against the published full PLUMED runtime before upload
        if: inputs.channel_runtime_check
        run: |
          source activate "$RUNNER_TEMP/gromacs-tools"
          packages=("$CONDA_BLD_PATH/${{ inputs.platform }}"/gromacs-plumed-*.conda)
          spec=$(python conda/gromacs/package.py spec --archive "${packages[0]}")
          # This channel must exclude the temporary minimal PLUMED package.
          mkdir -p "$RUNNER_TEMP/gromacs-channel/${{ inputs.platform }}"
          cp "${packages[0]}" "$RUNNER_TEMP/gromacs-channel/${{ inputs.platform }}/"
          conda index "$RUNNER_TEMP/gromacs-channel"
          conda create -y -p "$RUNNER_TEMP/channel-runtime" --override-channels \
            -c "file://$RUNNER_TEMP/gromacs-channel" -c plumed/label/test -c conda-forge \
            "$spec" python=3.12 numpy
          conda activate "$RUNNER_TEMP/channel-runtime"
          # Separate fresh output directory for the full-runtime validation.
          mv "$RUNNER_TEMP/gromacs-results" "$RUNNER_TEMP/gromacs-minimal-results"
          bash conda/gromacs/test-installed.sh
      - name: Collect validated package and digest manifest
        run: |
          source activate "$RUNNER_TEMP/gromacs-tools"
          python conda/gromacs/package.py record --platform '${{ inputs.platform }}' \
            --mpi '${{ matrix.mpi }}' --gpu '${{ matrix.gpu }}'
      - uses: actions/upload-artifact@v6
        with:
          name: gromacs-package-${{ inputs.platform }}-${{ matrix.mpi }}-${{ matrix.gpu }}
          path: packages/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve installed-package test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gromacs-results-${{ inputs.platform }}-${{ matrix.mpi }}-${{ matrix.gpu }}
          path: |
            ${{ runner.temp }}/gromacs-results/
            ${{ runner.temp }}/gromacs-minimal-results/
            ${{ runner.temp }}/gromacs-version.txt
          retention-days: 14
