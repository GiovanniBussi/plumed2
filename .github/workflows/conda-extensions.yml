name: Conda shared-kernel release validation
on:
  push:
    branches: [agents/conda-packaging/ci]
  workflow_dispatch:
concurrency:
  group: conda-packaging-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash -el {0}
env:
  VERSION: 2.11.0dev5
  CPU_COUNT: 4
  PLUMED_NUM_THREADS: 2
  CONDA_BLD_PATH: /tmp/plumed-conda-bld
jobs:
  kernel_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install packaging tools
        run: conda install -y conda-build python=3.13
      - name: Build and test the one Linux x86-64 kernel
        run: conda-build -c conda-forge conda/plumed
      - name: Preserve the exact kernel for all dependent jobs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-linux-64
          path: ${{ env.CONDA_BLD_PATH }}/linux-64/plumed-${{ env.VERSION }}-*.conda
          if-no-files-found: error
  linux_packages:
    needs: kernel_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install packaging tools
        run: conda install -y conda-build python=3.13
      - name: Restore the exact shared kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-linux-64
          path: ${{ env.CONDA_BLD_PATH }}/linux-64
      - name: Index the shared kernel
        run: conda index "$CONDA_BLD_PATH"
      - name: Build all variants against the shared kernel
        env:
          PLUMED_CONDA_SKIP_BASE: "yes"
        run: bash conda/run-conda-build.sh
      - name: Verify fresh installation and selection
        run: bash conda/run-conda-test.sh
      - name: Preserve packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conda-ubuntu-latest
          path: ${{ env.CONDA_BLD_PATH }}/*/*.conda
          if-no-files-found: ignore
  other_packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install packaging tools
        run: conda install -y conda-build python=3.13
      - name: Build kernel and supported variants
        run: bash conda/run-conda-build.sh
      - name: Verify fresh installation and selection
        run: bash conda/run-conda-test.sh
      - name: Preserve packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.os }}
          path: ${{ env.CONDA_BLD_PATH }}/*/*.conda
          if-no-files-found: ignore
  openacc:
    needs: kernel_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install packaging tools
        run: conda install -y conda-build python=3.13
      - name: Restore the exact shared kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-linux-64
          path: ${{ env.CONDA_BLD_PATH }}/linux-64
      - name: Index the shared kernel
        run: conda index "$CONDA_BLD_PATH"
      - name: Generate the plugin recipe
        run: python extensions/conda_recipe.py
      - name: Fetch isolated NVHPC build tools
        run: |
          bash conda/fetch-nvhpc.sh 25.11 "$RUNNER_TEMP/nvhpc"
          echo "NVHPC_HOME=$RUNNER_TEMP/nvhpc/opt/nvidia/hpc_sdk" >> "$GITHUB_ENV"
      - name: Build the multi-target plugin against the shared kernel
        run: conda-build -c local -c conda-forge conda/plumed-openacc
      - name: Verify installed host execution and unchanged kernel
        run: bash conda/run-openacc-test.sh
      - name: Preserve packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openacc-conda-ubuntu-latest
          path: ${{ env.CONDA_BLD_PATH }}/*/*.conda
          if-no-files-found: ignore
