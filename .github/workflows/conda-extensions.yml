name: Conda final Linux and Intel integration validation
on:
  push:
    branches: [agents/conda-packaging/cuda-final]
  workflow_dispatch:
concurrency:
  group: conda-packaging-cuda-final-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash -el {0}
env:
  VERSION: 2.11.0dev5
  CPU_COUNT: 4
  PLUMED_NUM_THREADS: 2
  CONDA_BLD_PATH: /tmp/plumed-conda-bld
jobs:
  linux_packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install packaging tools
        run: conda install -y conda-build python=3.13
      - name: Restore the original exact kernel and completed packages
        uses: actions/download-artifact@v4
        with:
          name: conda-${{ matrix.os }}
          run-id: 43201389162
          github-token: ${{ github.token }}
          path: ${{ env.CONDA_BLD_PATH }}
      - name: Index completed packages without obsolete CUDA outputs
        run: |
          rm -f "$CONDA_BLD_PATH"/*/plumed-ext-cuda-coordination-*.conda
          conda index "$CONDA_BLD_PATH"
      - name: Generate recipes
        run: python extensions/conda_recipe.py
      - name: Rebuild both corrected CUDA variants
        if: runner.os == 'Linux'
        env:
          CONDA_OVERRIDE_CUDA: "13.0"
        run: conda-build -c local -c conda-forge conda/plumed-cuda-coordination
      - name: Finish Intel packages after the original network timeout
        if: runner.os == 'macOS'
        env:
          CONDA_ALWAYS_COPY: "true"
        run: |
          conda-build -c local -c conda-forge conda/plumed-extensions
          conda-build -c local -c conda-forge conda/plumed-mpi
          conda-build -c local -c conda-forge conda/plumed-pycv
      - name: Verify all fresh package installation and selection
        run: bash conda/run-conda-test.sh
      - name: Preserve final packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.os }}
          path: ${{ env.CONDA_BLD_PATH }}/*/*.conda
          if-no-files-found: error
  combined_linux:
    needs: linux_packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install packaging tools
        run: conda install -y conda-build python=3.13
      - name: Download final CPU and CUDA artifacts
        uses: actions/download-artifact@v4
        with:
          name: conda-ubuntu-latest
          path: ${{ runner.temp }}/cpu-artifacts
      - name: Download the matching OpenACC artifact
        uses: actions/download-artifact@v4
        with:
          name: openacc-conda-ubuntu-latest
          run-id: 43201389162
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/openacc-artifacts
      - name: Verify exact base and combined loading without GPU execution
        env:
          CPU_CONDA_ARTIFACT_DIR: ${{ runner.temp }}/cpu-artifacts
          OPENACC_CONDA_ARTIFACT_DIR: ${{ runner.temp }}/openacc-artifacts
        run: bash conda/run-gpu-coinstall-test.sh
