name: Conda extension packages
on:
  push:
    branches: [agents/conda-packaging/ci]
  workflow_dispatch:
concurrency:
  group: conda-packaging-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  conda:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      VERSION: 2.11.0dev0
      CPU_COUNT: 4
      PLUMED_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install packaging tools
        run: conda install -y conda-build python=3.13
      - name: Select the installed macOS SDK
        if: runner.os == 'macOS'
        run: echo "CONDA_BUILD_SYSROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Build packages
        run: make -C conda
      - name: Test extension installation and MPI providers
        run: make -C conda test
      - name: Preserve conda packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.os }}
          path: ${{ env.CONDA }}/conda-bld/*/plumed*.conda
          if-no-files-found: ignore
