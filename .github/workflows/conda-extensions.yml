name: Conda latest-master GPU package integration
on:
  push:
    branches: [agents/conda-packaging/draft-gpu]
  workflow_dispatch:
concurrency:
  group: conda-packaging-draft-gpu-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash -el {0}
env:
  VERSION: 2.11.0dev8
  CPU_COUNT: 4
  PLUMED_NUM_THREADS: 2
  CONDA_BLD_PATH: /tmp/plumed-conda-bld
jobs:
  kernel_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install packaging tools
        run: conda install -y conda-build python=3.13
      - name: Build and test the one Linux x86-64 kernel
        run: |
          python extensions/conda_recipe.py
          python conda/tests/publication.py
          conda-build -c conda-forge conda/plumed
      - name: Preserve the exact kernel for all dependent jobs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-linux-64
          path: ${{ env.CONDA_BLD_PATH }}/linux-64/plumed-${{ env.VERSION }}-*.conda
          if-no-files-found: error
  linux_packages:
    needs: kernel_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install packaging tools
        run: conda install -y conda-build python=3.13
      - name: Restore the exact shared kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-linux-64
          path: ${{ env.CONDA_BLD_PATH }}/linux-64
      - name: Index the shared kernel
        run: conda index "$CONDA_BLD_PATH"
      - name: Build both CUDA variants against the shared kernel
        env:
          CONDA_OVERRIDE_CUDA: "13.0"
        run: |
          python extensions/conda_recipe.py
          conda-build -c local -c conda-forge conda/plumed-cuda-coordination
      - name: Check variant selection and loading without GPU execution
        run: bash conda/run-cuda-coordination-test.sh
      - name: Preserve packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conda-ubuntu-latest
          path: ${{ env.CONDA_BLD_PATH }}/*/*.conda
          if-no-files-found: ignore
  openacc:
    needs: kernel_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install packaging tools
        run: conda install -y conda-build python=3.13
      - name: Restore the exact shared kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-linux-64
          path: ${{ env.CONDA_BLD_PATH }}/linux-64
      - name: Index the shared kernel
        run: conda index "$CONDA_BLD_PATH"
      - name: Generate the plugin recipe
        run: python extensions/conda_recipe.py
      - name: Fetch isolated NVHPC build tools
        run: |
          bash conda/fetch-nvhpc.sh 25.11 "$RUNNER_TEMP/nvhpc"
          echo "NVHPC_HOME=$RUNNER_TEMP/nvhpc/opt/nvidia/hpc_sdk" >> "$GITHUB_ENV"
      - name: Build the multi-target plugin against the shared kernel
        run: conda-build -c local -c conda-forge conda/plumed-openacc
      - name: Verify installed host execution and unchanged kernel
        run: bash conda/run-openacc-test.sh
      - name: Preserve packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openacc-conda-ubuntu-latest
          path: ${{ env.CONDA_BLD_PATH }}/*/*.conda
          if-no-files-found: ignore
  combined_linux:
    needs: [linux_packages, openacc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install packaging tools
        run: conda install -y conda-build python=3.13
      - name: Download CPU and CUDA artifacts
        uses: actions/download-artifact@v4
        with:
          name: conda-ubuntu-latest
          path: ${{ runner.temp }}/cpu-artifacts
      - name: Download OpenACC artifacts
        uses: actions/download-artifact@v4
        with:
          name: openacc-conda-ubuntu-latest
          path: ${{ runner.temp }}/openacc-artifacts
      - name: Verify common kernel and co-installation without GPU execution
        env:
          CPU_CONDA_ARTIFACT_DIR: ${{ runner.temp }}/cpu-artifacts
          OPENACC_CONDA_ARTIFACT_DIR: ${{ runner.temp }}/openacc-artifacts
        run: bash conda/run-gpu-coinstall-test.sh
