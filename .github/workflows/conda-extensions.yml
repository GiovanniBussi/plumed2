name: Conda Intel macOS packaging
on:
  push:
    branches: [agents/conda-packaging/ci]
  workflow_dispatch:
concurrency:
  group: conda-packaging-intel-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      VERSION: 2.11.0dev4
      CPU_COUNT: 4
      PLUMED_NUM_THREADS: 2
      CONDA_BLD_PATH: /tmp/plumed-conda-bld
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install packaging tools
        run: conda install -y conda-build python=3.13
      - name: Build kernel and all supported variants
        run: bash conda/run-conda-build.sh
      - name: Verify fresh installation and selection
        run: bash conda/run-conda-test.sh
      - name: Preserve packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.os }}
          path: ${{ env.CONDA_BLD_PATH }}/*/*.conda
          if-no-files-found: ignore
