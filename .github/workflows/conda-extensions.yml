name: Conda CUDA coordination variants
on:
  push:
    branches: [agents/conda-packaging/ci]
  workflow_dispatch:
concurrency:
  group: conda-packaging-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  cuda:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      VERSION: 2.11.0dev0
      CPU_COUNT: 4
      PLUMED_NUM_THREADS: 2
      # Compilation and native loading do not execute GPU calculations.
      CONDA_OVERRIDE_CUDA: '13.0'
      CONDA_BLD_PATH: /tmp/plumed-conda-bld
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install packaging tools
        run: conda install -y conda-build python=3.13
      # Keep the already-tested main kernel fixed while iterating plugin builds.
      - name: Restore the main kernel archive
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42837350520
          name: cuda-conda-${{ matrix.os }}
          path: ${{ runner.temp }}/base-package
      - name: Index the fixed main kernel
        run: |
          subdir=$(conda info --json | python -c 'import json,sys; print(json.load(sys.stdin)["platform"])')
          mkdir -p "$CONDA_BLD_PATH/$subdir"
          base=$(find "$RUNNER_TEMP/base-package" -name "plumed-${VERSION}-*.conda" -type f)
          test -n "$base"
          cp "$base" "$CONDA_BLD_PATH/$subdir/"
          conda index "$CONDA_BLD_PATH"
      - name: Build both CUDA variants against that kernel
        run: |
          python extensions/conda_recipe.py
          conda-build -c local -c conda-forge conda/plumed-cuda-coordination
      - name: Verify variant selection and unchanged main kernel
        run: bash conda/run-cuda-coordination-test.sh
      - name: Preserve conda packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-conda-${{ matrix.os }}
          path: ${{ env.CONDA_BLD_PATH }}/*/plumed*.conda
          if-no-files-found: ignore
